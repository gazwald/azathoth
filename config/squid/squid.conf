http_port 3128
visible_hostname proxy

# --- Allow list ---
acl allowed_domains dstdomain \
    .poppet.io \
    tika

acl inference_domains dstdomain \
    lemonade \
    lemonade.ai.poppet.io


# acl localhost src 0.0.0.0/32 127.0.0.0/8 ::1
# acl localnet  src 172.16.0.0/12 10.0.0.0/8 192.168.0.0/16

# --- Access rules ---
# http_access deny localhost
# http_access deny localnet
http_access allow allowed_domains
http_access allow all # TODO: Remove

# --- never cache ---
never_cache allow inference_domains
never_cache allow method POST
