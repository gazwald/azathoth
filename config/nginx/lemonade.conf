upstream lemonade {
    server lemonade:13305;
    keepalive 128;
    keepalive_timeout 1800s;
    keepalive_requests 10000;
}


server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name openai.ai.poppet.io;

    client_max_body_size 250M;
    ssl_certificate /etc/letsencrypt/live/ai.poppet.io-0001/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/ai.poppet.io-0001/privkey.pem; # managed by Certbot

    include /etc/letsencrypt/options-ssl-nginx.conf;

    gzip off;

    location / {
        proxy_pass http://lemonade;


	proxy_http_version 1.1;
	proxy_set_header Upgrade $http_upgrade;
	proxy_set_header Host '127.0.0.1:13305';
        proxy_set_header Connection 'upgrade';
	proxy_set_header X-Forwarded-Host $host;
	proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Critical for NDJSON streaming.
        proxy_buffering off;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        proxy_request_buffering off;
        proxy_cache off;
        tcp_nodelay on;
        add_header X-Accel-Buffering "no" always;
        add_header Cache-Control "no-store" always;
    }
}
