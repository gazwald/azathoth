server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name sonarqube.ai.poppet.io;

    ssl_certificate /etc/letsencrypt/live/ai.poppet.io-0001/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/ai.poppet.io-0001/privkey.pem; # managed by Certbot

    include /etc/letsencrypt/options-ssl-nginx.conf;

    location / {
        proxy_pass http://sonarqube;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}
